version: "3.1"

intents:
  - greet
  - goodbye
  - shipping_address_update
  - provide_order_id
  - provide_new_address
  - confirm
  - deny
  - request_human
  - out_of_scope

entities:
  - order_id
  - new_address

actions:
  - action_submit_shipping_update
  - action_cancel_shipping_update
  - validate_shipping_address_update_form

slots:
  uid:
    type: text
    mappings:
      - type: custom

  language:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  order_id:
    type: text
    mappings:
      - type: from_entity
        entity: order_id
      - type: from_text
        conditions:
          - active_loop: shipping_address_update_form
            requested_slot: order_id

  new_address:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: shipping_address_update_form
            requested_slot: new_address

  confirm_order_id:
    type: bool
    influence_conversation: false
    mappings:
      - type: from_intent
        intent: confirm
        value: true
        conditions:
          - active_loop: shipping_address_update_form
            requested_slot: confirm_order_id
      - type: from_intent
        intent: deny
        value: false
        conditions:
          - active_loop: shipping_address_update_form
            requested_slot: confirm_order_id

  confirm_address:
    type: bool
    influence_conversation: false
    mappings:
      - type: from_intent
        intent: confirm
        value: true
        conditions:
          - active_loop: shipping_address_update_form
            requested_slot: confirm_address
      - type: from_intent
        intent: deny
        value: false
        conditions:
          - active_loop: shipping_address_update_form
            requested_slot: confirm_address

forms:
  shipping_address_update_form:
    required_slots:
      - order_id
      - confirm_order_id
      - new_address
      - confirm_address

responses:
  utter_greet:
    - condition:
        - type: slot
          name: language
          value: French
      text: "Bonjour ! Comment puis-je vous aider aujourd'hui ?"
    - text: "Hello! How can I help you today?"

  utter_goodbye:
    - condition:
        - type: slot
          name: language
          value: French
      text: "Au revoir !"
    - text: "Goodbye!"

  utter_ask_order_id:
    - condition:
        - type: slot
          name: language
          value: French
      text: "Veuillez fournir votre identifiant de commande."
    - text: "Please provide your order ID."

  utter_ask_new_address:
    - condition:
        - type: slot
          name: language
          value: French
      text: "Veuillez fournir la nouvelle adresse de livraison."
    - text: "Please provide the new shipping address."

  utter_ask_confirm_order_id:
    - condition:
        - type: slot
          name: language
          value: French
      text: "Vous avez saisi \"{order_id}\" comme identifiant de commande. Entrez Oui pour confirmer ou Non pour saisir à nouveau."
    - text: "You entered \"{order_id}\" as your order ID. Enter Yes to confirm or No to Input order ID again."

  utter_ask_confirm_address:
    - condition:
        - type: slot
          name: language
          value: French
      text: "Vous avez saisi \"{new_address}\" comme nouvelle adresse de livraison. Entrez Oui pour confirmer ou Non pour saisir à nouveau."
    - text: "You entered \"{new_address}\" as your new shipping address. Enter Yes to confirm or No to Input address again."

  utter_confirm_update:
    - condition:
        - type: slot
          name: language
          value: French
      text: "Merci. Veuillez confirmer que vous souhaitez mettre à jour votre adresse de livraison. Répondez 'Oui' ou 'Non'."
    - text: "Thank you. Please confirm that you want to update your shipping address. Reply 'Yes' or 'No'."

  utter_cancel:
    - condition:
        - type: slot
          name: language
          value: French
      text: "D'accord, la demande de mise à jour de l'adresse a été annulée."
    - text: "Okay, the address update request has been cancelled."

  utter_human_handoff:
    - condition:
        - type: slot
          name: language
          value: French
      text: "Je vais vous mettre en relation avec un conseiller clientèle humain."
    - text: "I'll connect you to a human support agent."

  utter_out_of_scope:
    - condition:
        - type: slot
          name: language
          value: French
      text: "Désolé, je ne peux vous aider que pour les mises à jour d'adresse de livraison."
    - text: "Sorry, I can only help with shipping address updates."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

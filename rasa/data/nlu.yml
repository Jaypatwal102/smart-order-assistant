version: "3.1"

nlu:
  # -------------------------
  # GREET
  # -------------------------
  - intent: greet
    examples: |
      - hi
      - hii
      - heyy
      - heyya
      - hello
      - hey
      - good morning
      - good evening
      - hey there
      - hello bot
      - hi there
      - greetings
      - good afternoon

  # -------------------------
  # GOODBYE
  # -------------------------
  - intent: goodbye
    examples: |
      - bye
      - goodbye
      - see you
      - see you later
      - thanks bye
      - catch you later
      - talk to you later
      - have a nice day

